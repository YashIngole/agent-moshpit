# Checks on every push and pull request, on the three systems the app targets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    env:
      MOSHPIT_INSTANCE: voiceci
      MOSHPIT_DATA_DIR: ${{ github.workspace }}/.moshpit-ci-data
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Linux packages Tauri needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential libasound2-dev cmake

      - name: Use packaged Whisper bindings on Linux
        if: runner.os == 'Linux'
        run: echo "WHISPER_DONT_GENERATE_BINDINGS=1" >> "$GITHUB_ENV"

      # The pinned packaged bindings contain glibc layouts. Windows and macOS
      # generate target bindings using LLVM already installed on these runners.
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV 'LIBCLANG_PATH=C:\Program Files\LLVM\bin'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: npm ci

      - name: Interface types
        run: npm run check

      - name: Interface unit tests
        run: npm test

      - name: Release tooling tests
        run: npm run test:tools

      - name: Interface build
        run: npm run build

      # Uses the Chrome or Edge already on the runner; nothing is downloaded.
      - name: Interface in a browser, with demo data
        run: node tools/e2e/ui-demo.mjs

      - name: Core lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Core tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Desktop build
        run: npx tauri build --debug --no-bundle

      # Edge Stable on the hosted image is not the WebView2 Runtime. Raw app
      # tests do not run an installer, so provision their required runtime here.
      - name: Windows WebView2 Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          function RuntimeVersion {
            foreach ($key in $runtimeKeys) {
              $version = (Get-ItemProperty -LiteralPath $key -Name pv -ErrorAction SilentlyContinue).pv
              if ($version -and [version]$version -gt [version]'0.0.0.0') { return $version }
            }
          }
          $version = RuntimeVersion
          if (-not $version) {
            Write-Host 'WebView2 Runtime is absent; installing it on the disposable CI runner.'
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            $installer = Start-Process -FilePath $bootstrapper -ArgumentList '/silent','/install' -WindowStyle Hidden -Wait -PassThru
            $version = RuntimeVersion
            if (-not $version) { throw "WebView2 Runtime install failed (exit $($installer.ExitCode))." }
          }
          Write-Host "WebView2 Runtime $version"

      - name: Windows desktop terminals and persistence
        if: runner.os == 'Windows'
        env:
          MOSHPIT_APP: ${{ github.workspace }}\src-tauri\target\debug\agent-moshpit.exe
        run: npm run test:app

      - name: Dependency advisories
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit
          npm audit --omit=dev

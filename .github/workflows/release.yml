# Builds installers for the three systems when a version tag is pushed, and
# attaches them to a draft GitHub release. A person reads the draft and publishes it.
#
# The draft's text is docs/releases/<tag>.md when that file exists.
#
# The installers are not signed with a bought certificate, so Windows and macOS
# warn the first time. The macOS app is signed ad hoc (see tauri.conf.json), which
# is what lets it open at all on Apple Silicon.
#
# Assets are named without the version, so that
# https://github.com/<owner>/<repo>/releases/latest/download/<name> always points
# at the newest one. The download page (site/) links to those names.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # One draft, made first, so that the four builds below do not each make their own.
  draft:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Find or make the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          find_draft() { gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name == \"$TAG\" and .draft)][0].id // empty"; }
          id=$(find_draft)
          if [ -z "$id" ]; then
            notes="docs/releases/$TAG.md"
            if [ -f "$notes" ]; then
              gh release create "$TAG" --draft --verify-tag --title "Agent Moshpit $TAG" --notes-file "$notes"
            else
              gh release create "$TAG" --draft --verify-tag --title "Agent Moshpit $TAG" --notes ""
            fi
            id=$(find_draft)
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Both Macs are built on Apple Silicon; the Intel one is cross-compiled.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux packages Tauri needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential patchelf file

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: --target ${{ matrix.target }}
          releaseAssetNamePattern: 'agent-moshpit_[platform]_[arch][setup][ext]'

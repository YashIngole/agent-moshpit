# Builds installers for the three systems when a version tag is pushed, and
# attaches them to a draft GitHub release. A person reads the draft and publishes it.
#
# The draft's text is docs/releases/<tag>.md when that file exists.
#
# The installers are not signed with a bought certificate, so Windows and macOS
# warn the first time. The macOS app is signed ad hoc (see tauri.conf.json), which
# is what lets it open at all on Apple Silicon.
#
# What an office already installed updates itself from is signed with the app's own
# update key: the secret TAURI_SIGNING_PRIVATE_KEY here, its public half in
# tauri.conf.json. The last job writes latest.json, which a running office reads to
# learn that a newer version is out (tools/release-manifest.mjs).
#
# Assets are named without the version, so that
# https://github.com/<owner>/<repo>/releases/latest/download/<name> always points
# at the newest one. The download page (site/) links to those names.
name: Release

on:
  push:
    tags: ['v*']
  # By hand, for a tag that is already there: the installers are built from the tag,
  # by this file as it is on the branch the run is started from.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The version tag to build, for example v0.2.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  # One draft, made first, so that the four builds below do not each make their own.
  draft:
    needs: [resolve, quality]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Find or make the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name == \"$TAG\" and .draft)][0].id // empty")
          if [ -z "$id" ]; then
            notes="docs/releases/$TAG.md"
            [ -f "$notes" ] || { notes=$(mktemp); : > "$notes"; }
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST -f tag_name="$TAG" -f name="Agent Moshpit $TAG" -F draft=true -F body=@"$notes" --jq .id)
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [resolve, draft, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Both Macs are built on Apple Silicon; the Intel one is cross-compiled.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Linux packages Tauri needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential libasound2-dev cmake patchelf file

      - name: Use packaged Whisper bindings on Linux
        if: runner.os == 'Linux'
        run: echo "WHISPER_DONT_GENERATE_BINDINGS=1" >> "$GITHUB_ENV"

      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV 'LIBCLANG_PATH=C:\Program Files\LLVM\bin'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Refresh Windows native build configuration
        if: runner.os == 'Windows'
        run: cargo clean --manifest-path src-tauri/Cargo.toml -p whisper-rs-sys --release --target ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          # tauri.release.conf.json asks for the signed files an office updates itself from.
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          releaseAssetNamePattern: 'agent-moshpit_[platform]_[arch][setup][ext]'
          # Four builds writing one latest.json at once can lose each other's part: it is written once, below.
          uploadUpdaterJson: false

      - name: Windows release runtime linkage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'Visual Studio dumpbin was not found.' }
          $dependencies = & $dumpbin.FullName /DEPENDENTS 'src-tauri/target/${{ matrix.target }}/release/agent-moshpit.exe'
          $dependencies
          if ($LASTEXITCODE -ne 0) { throw 'The release executable could not be inspected.' }
          if ($dependencies -match '(?i)\b(?:msvcp|msvcr|vcruntime)\d+[^\s]*\.dll') {
            throw 'The release requires an unbundled Microsoft C++ runtime DLL.'
          }

  # latest.json, from the signatures the builds attached.
  manifest:
    needs: [resolve, draft, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Write latest.json and attach it
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release-manifest.mjs "$GITHUB_REPOSITORY" "${{ needs.draft.outputs.release_id }}" "$TAG"
